name: CI

# Every pull request that touches the graph is a claim about mathematics.
# This workflow checks the part of that claim a machine can check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: validate graph (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install
        run: python -m pip install --upgrade pip -r tools/requirements.txt

      - name: Validate the graph (warnings are errors on CI)
        working-directory: tools
        run: python -m proofgraph validate --strict

      - name: Tests
        working-directory: tools
        env:
          # Third-party pytest plugins in a contributor's global environment have
          # broken collection before now. The suite needs no plugins.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest

      - name: Summary
        working-directory: tools
        run: python -m proofgraph stats

  export:
    name: build graph exports
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip -r tools/requirements.txt
      - name: Render
        working-directory: tools
        run: |
          mkdir -p ../build
          python -m proofgraph render json -o ../build/graph.json
          python -m proofgraph render dot  -o ../build/graph.dot
          python -m proofgraph render mermaid -o ../build/graph.mmd
      - uses: actions/upload-artifact@v4
        with:
          name: proofgraph-exports
          path: build/
