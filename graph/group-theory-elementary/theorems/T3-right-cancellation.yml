id: T3
kind: theorem
title: Right cancellation
statement:
  natural: 'For all a, b, c in G, if b·a = c·a then b = c.'
  latex: '\forall a, b, c \in G:\; b \cdot a = c \cdot a \implies b = c'
  context: [A1]
proof:
  strategy: >
    The mirror image of T2: multiply on the right by an inverse of a instead of the left.
    It is not a corollary of T2 because · is not assumed commutative, so a·b = a·c and
    b·a = c·a are independent hypotheses. The mirror argument goes through because A3 and
    A4 are both two-sided.
  hypotheses:
    - 'h: a, b, c are in G and b·a = c·a'
  steps:
    - n: 1
      id: pick-inverse
      claim: "there is an element a' in G with a·a' = e"
      by: [A4]
    - n: 2
      id: multiply-right
      claim: "(b·a)·a' = (c·a)·a'"
      by: ['hyp:h', L2, A1]
      note: >
        L2 substitutes equals into the left factor of (−)·a'. Instantiating L2 at the
        products b·a and c·a needs A1.
    - n: 3
      id: reassociate
      claim: "(b·a)·a' = b·(a·a') and (c·a)·a' = c·(a·a')"
      by: [A2]
    - n: 4
      id: combine
      claim: "b·(a·a') = c·(a·a')"
      by: [s:reassociate, s:multiply-right, L1]
    - n: 5
      id: collapse-inverse
      claim: "b·(a·a') = b·e and c·(a·a') = c·e"
      by: [s:pick-inverse, L2, A1]
      note: "L2 substitutes a·a' = e into the right factor; A1 puts the product a·a' in G."
    - n: 6
      id: identity-both
      claim: "b·e = c·e"
      by: [s:collapse-inverse, s:combine, L1]
    - n: 7
      id: drop-identity
      claim: "b·e = b and c·e = c"
      by: [A3]
    - n: 8
      id: conclude
      claim: "b = c"
      by: [s:drop-identity, s:identity-both, L1]
status: draft
formalization:
  metamath: grprcan
  lean: mul_right_cancel
provenance:
  source: 'Standard; any first course in algebra.'
  contributed_by: 'ProofWeb pilot'
  assisted_by: 'Claude (drafted), human review pending'
tags: [cancellation]
