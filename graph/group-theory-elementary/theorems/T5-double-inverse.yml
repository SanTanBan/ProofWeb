id: T5
kind: theorem
title: The inverse of an inverse is the original element
statement:
  natural: "For all a in G, (a')' = a."
  latex: '\forall a \in G:\; (a'')'' = a'
  context: [A1, A3, A4, T4]
proof:
  strategy: >
    A4 gives two equations that are symmetric in a and a'. Read the other way round, they
    say that a is an inverse of a'. Uniqueness of inverses then forces it to be the inverse.
  steps:
    - n: 1
      id: inverse-equations
      claim: "a·a' = e and a'·a = e"
      by: [A4]
    - n: 2
      id: inverse-of-inverse
      claim: "a' is in G, and a' has an inverse (a')' satisfying a'·(a')' = e"
      by: [A4]
      note: "A4 applied to the element a' rather than to a."
    - n: 3
      id: two-candidates
      claim: "a'·a = e and a'·(a')' = e"
      by: [s:inverse-equations, s:inverse-of-inverse]
    - n: 4
      id: conclude
      claim: "(a')' = a"
      by: [s:two-candidates, T4, L1]
      note: "T4 applied with the outer element a', comparing the two candidate inverses (a')' and a."
status: draft
formalization:
  metamath: grpinvinv
  lean: inv_inv
provenance:
  source: 'Standard; any first course in algebra.'
  contributed_by: 'ProofWeb pilot'
  assisted_by: 'Claude (drafted), human review pending'
tags: [inverse]
