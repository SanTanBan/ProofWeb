id: T7
kind: theorem
title: The identity is its own inverse
statement:
  natural: "e' = e."
  latex: 'e'' = e'
  context: [A1, A3, A4, T4]
proof:
  strategy: 'e·e = e = e·e'' says e is an inverse of e; uniqueness does the rest.'
  steps:
    - n: 1
      id: identity-squared
      claim: "e·e = e"
      by: [A3]
      note: 'The identity property of e, instantiated at a := e.'
    - n: 2
      id: identity-times-inverse
      claim: "e·e' = e"
      by: [A3, A4]
      note: "A4 gives e·e' = e directly, e being an element of G by A3."
    - n: 3
      id: conclude
      claim: "e' = e"
      by: [s:identity-squared, s:identity-times-inverse, T4, L1]
      note: "T4 with outer element e, comparing the candidate inverses e' and e."
status: draft
formalization:
  metamath: grpinvid
  lean: inv_one
provenance:
  source: 'Standard; any first course in algebra.'
  contributed_by: 'ProofGraph pilot'
  assisted_by: 'Claude (drafted), human review pending'
tags: [identity, inverse]
